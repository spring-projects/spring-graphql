name: CI
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  ci:
    name: '${{ matrix.os.name}} | Java ${{ matrix.java.version}}'
    runs-on: ${{ matrix.os.id }}
    if: ${{ github.repository == 'spring-projects/spring-graphql' || github.repository == 'spring-projects/spring-graphql-commercial' }}
    strategy:
      matrix:
        os:
          - id: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
            name: Linux
        java:
          - version: 17
            toolchain: true
          - version: 21
            toolchain: true
          - version: 25
            toolchain: false
          - version: 26
            toolchain: true
        exclude:
          - os:
              name: Linux
            java:
              version: 25
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        id: build
        uses: ./.github/actions/build-and-publish
        with:
          commercial-release-repository-url: ${{ vars.COMMERCIAL_RELEASE_REPO_URL }}
          commercial-repository-password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
          commercial-repository-username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          commercial-snapshot-repository-url: ${{ vars.COMMERCIAL_SNAPSHOT_REPO_URL }}
          publish: false
          java-version: ${{ matrix.java.version }}
          java-early-access: ${{ matrix.java.early-access || 'false' }}
          java-distribution: ${{ matrix.java.distribution || 'liberica' }}
          java-toolchain: ${{ matrix.java.toolchain }}
          develocity-access-key: ${{ vars.COMMERCIAL && secrets.GRADLE_ENTERPRISE_SECRET_ACCESS_KEY }}
      - name: Send Notification
        uses: ./.github/actions/send-notification
        if: always()
        with:
          webhook-url: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          status: ${{ job.status }}
          build-scan-url: ${{ steps.build.outputs.build-scan-url }}
          run-name: ${{ format('{0} | {1} | Java {2}', github.ref_name, matrix.os.name, matrix.java.version) }}