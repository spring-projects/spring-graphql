[versions]
assertj = "3.27.7"
graphql-java = "26.1"
jackson2 = "2.21.5"
jackson3 = "3.1.5"
junit = "6.1.3"
kotlinx-coroutines = "1.11.0"
log4j = "2.26.1"
micrometer = "1.18.0-RC1"
micrometer-tracing = "1.8.0-RC1"
mockito = "5.23.0"
querydsl = "5.1.0"
reactor = "2026.0.0-RC1"
rsocket = "1.1.5"
selenium = "4.20.0"
spring-data-bom = "2026.1.0-RC1"
spring-framework = "7.1.0-RC1"
spring-security = "7.2.0-RC1"
testcontainers = "2.0.5"

[libraries]
assertj-bom = { module = "org.assertj:assertj-bom", version.ref = "assertj" }
graphql-java = { module = "com.graphql-java:graphql-java", version.ref = "graphql-java" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
log4j-bom = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j" }
micrometer-bom = { module = "io.micrometer:micrometer-bom", version.ref = "micrometer" }
micrometer-tracing-bom = { module = "io.micrometer:micrometer-tracing-bom", version.ref = "micrometer-tracing" }
mockito-bom = { module = "org.mockito:mockito-bom", version.ref = "mockito" }
querydsl-bom = { module = "com.querydsl:querydsl-bom", version.ref = "querydsl" }
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor" }
