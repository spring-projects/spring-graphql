plugins {
	id 'java-platform'
}

javaPlatform {
	allowDependencies()
}

dependencies {
	api(enforcedPlatform(libs.spring.framework.bom))
	api(platform(libs.jackson2.bom))
	api(platform(libs.jackson3.bom))
	api(platform(libs.reactor.bom))
	api(platform(libs.micrometer.bom))
	api(platform(libs.micrometer.tracing.bom))
	api(platform(libs.spring.data.bom))
	api(platform(libs.spring.security.bom))
	api(platform(libs.querydsl.bom))
	api(platform(libs.rsocket.bom))
	api(platform("org.jetbrains.kotlin:kotlin-bom:${kotlinVersion}"))
	api(platform(libs.kotlinx.coroutines.bom))
	api(platform(libs.junit.bom))
	api(platform(libs.mockito.bom))
	api(platform(libs.testcontainers.bom))
	api(platform(libs.log4j.bom))
	api(platform(libs.assertj.bom))
	api(platform(libs.selenium.bom))

	constraints {
		api(libs.graphql.java)

		api("jakarta.annotation:jakarta.annotation-api:3.0.0")
		api("jakarta.servlet:jakarta.servlet-api:6.1.0")
		api("jakarta.websocket:jakarta.websocket-api:2.2.0")
		api("jakarta.websocket:jakarta.websocket-client-api:2.2.0")
		api("jakarta.validation:jakarta.validation-api:3.1.1")
		api("jakarta.persistence:jakarta.persistence-api:3.2.0")

		api("com.apollographql.federation:federation-graphql-java-support:7.0.0")
		api("com.netflix.graphql.dgs.codegen:graphql-dgs-codegen-shared-core:8.5.0")

		api("org.apache.tomcat.embed:tomcat-embed-el:11.0.24")

		api("com.google.code.findbugs:jsr305:3.0.2")
		api("com.jayway.jsonpath:json-path:3.0.0")
		api("org.skyscreamer:jsonassert:1.5.3")
		api("org.awaitility:awaitility:4.3.0")
		api("com.squareup.okhttp3:mockwebserver3:5.5.0")
		api("org.hamcrest:hamcrest:3.0")
		api("io.mockk:mockk:1.14.11")

		api("com.h2database:h2:2.4.240")
		api("org.hibernate.orm:hibernate-core:7.4.5.Final")
		api("org.hibernate.validator:hibernate-validator:9.1.3.Final")
		api("org.mongodb:bson:5.9.2")
		api("org.mongodb:mongodb-driver-core:5.9.2")
		api("org.mongodb:mongodb-driver-reactivestreams:5.9.2")
		api("org.mongodb:mongodb-driver-sync:5.9.2")
	}

}
